dependencies {
    implementation project(':common')

    // 커스텀 아바타 presigned URL 발급 — R2/S3 인프라는 storage 모듈이 공유 제공.
    implementation project(':storage')

    // 컨트롤러에서 인증된 memberId(@AuthenticationPrincipal)를 읽기 위한 최소 의존.
    // 시큐리티 필터/설정은 auth 모듈이 소유하고, member 는 SecurityContext 만 읽는다.
    implementation 'org.springframework.boot:spring-boot-starter-security'
}
