# 로컬 개발용 인프라.
name: nalssilog-api

services:
  postgres:
    image: postgres:17-alpine
    container_name: nalssilog-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: nalssilog
      POSTGRES_USER: nalssilog
      POSTGRES_PASSWORD: nalssilog-local
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nalssilog"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: nalssilog-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
