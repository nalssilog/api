# 로컬 개발용 인프라.
name: nalssilog-api

services:
  postgres:
    image: postgres:17-alpine
    container_name: nalssilog-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: nalssilog
      POSTGRES_USER: nalssilog
      POSTGRES_PASSWORD: nalssilog-local
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nalssilog"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: nalssilog-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # 로컬 이미지 스토리지(S3 호환). prod 는 Cloudflare R2, 로컬은 이걸로 presign 업로드까지 실동작 테스트.
  minio:
    image: minio/minio:latest
    container_name: nalssilog-minio
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # 웹 콘솔
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio-data:/data

  # MinIO 기동 후 nalssilog 버킷 생성 + 익명 읽기 허용(public-base-url 로 이미지 조회 가능하게). 1회 실행 후 종료.
  minio-init:
    image: minio/mc:latest
    container_name: nalssilog-minio-init
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 minioadmin minioadmin; do echo 'waiting for minio...'; sleep 1; done;
      mc mb --ignore-existing local/nalssilog;
      mc anonymous set download local/nalssilog;
      echo 'minio bucket ready';
      "

volumes:
  postgres-data:
  minio-data:
